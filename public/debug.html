<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debug — anon token</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card" style="max-width: 560px; text-align: left;">
    <h1>Debug (dev only)</h1>
    <div class="meta">
      <div><span>anon_token</span></div>
    </div>
    <code id="token" style="display:block; margin: 8px 0 16px;"></code>
    <table>
      <thead>
        <tr><th>Produit</th><th>1er scan</th><th>Dernier scan</th><th>Count</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="message" id="total" style="margin-top:16px;"></p>
    <button id="reset-all-btn" style="width:100%; margin-top:12px; padding:10px; border-radius:10px; border:1px solid #7f1d1d; color:#fca5a5; background:rgba(255,255,255,0.04); font-size:13px;">
      🗑️ Réinitialiser toutes les données (dev)
    </button>
  </div>

  <script type="module" src="/debug.js"></script>
</body>
</html>
